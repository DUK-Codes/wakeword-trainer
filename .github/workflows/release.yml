name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import pathlib, zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())

          required = {
              "wakeword_trainer/resources/models/melspectrogram.onnx",
              "wakeword_trainer/resources/models/embedding_model.onnx",
              "wakeword_trainer/tts/templates/custom_backend.py",
              "wakeword_trainer/tts/catalog/piper_voices.json",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"missing from wheel: {missing}")
          if not any(name.endswith(".dist-info/licenses/LICENSE") for name in names):
              raise SystemExit("LICENSE missing from wheel metadata")
          print(f"wheel contains {len(names)} files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  exe:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and build tools
        run: |
          pip install -e ".[gui]" "pyinstaller>=6,<7"
      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $paths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          if (-not ($paths | Where-Object { Test-Path $_ })) {
            choco install innosetup --yes --no-progress
          }
          Get-ChildItem $paths -ErrorAction SilentlyContinue | Select-Object FullName
      - name: Build installer, portable archive and components
        shell: pwsh
        run: |
          packaging/build_win.ps1 -Clean
          Get-ChildItem dist -File | Select-Object Name, Length
      - name: Verify build outputs
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if (-not $version) { throw "could not read the project version from pyproject.toml" }
          Write-Host "project version: $version"
          $required = @(
            "dist/WakeWordTrainer/WakeWordTrainer.exe",
            "dist/wakeword-trainer-$version-windows-x64-setup.exe",
            "dist/wakeword-trainer-$version-windows-x64-portable.zip",
            "dist/component-tts-piper.zip"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "missing build output: $path" }
          }
          if (Test-Path "dist/WakeWordTrainer/components") {
            throw "the base build must not contain speech engines"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("dist/wakeword-trainer-$version-windows-x64-portable.zip")
          $entries = $zip.Entries | ForEach-Object { $_.FullName }
          $zip.Dispose()
          if (-not ($entries -contains "WakeWordTrainer/WakeWordTrainer.exe")) {
            throw "portable archive does not contain the application"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/wakeword-trainer-*-windows-x64-setup.exe
            dist/wakeword-trainer-*-windows-x64-portable.zip
            dist/component-*.zip

  pypi:
    name: Publish to PyPI
    needs: dist
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Check credentials
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::PYPI_API_TOKEN is empty - using Trusted Publishing (OIDC)."
          else
            echo "::notice::Publishing with PYPI_API_TOKEN."
          fi
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty secret falls back to Trusted Publishing (OIDC).
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A re-run of an already published tag must not fail: PyPI rejects
          # duplicate filenames, and the files are byte-identical anyway.
          skip-existing: true

  release:
    name: Create GitHub release
    needs: [dist, exe]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "wakeword-trainer ${GITHUB_REF_NAME}" \
            --generate-notes
