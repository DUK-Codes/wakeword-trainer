name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import pathlib, zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())

          required = {
              "wakeword_trainer/resources/models/melspectrogram.onnx",
              "wakeword_trainer/resources/models/embedding_model.onnx",
              "wakeword_trainer/tts/templates/custom_backend.py",
              "wakeword_trainer/tts/catalog/piper_voices.json",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"missing from wheel: {missing}")
          if not any(name.endswith(".dist-info/licenses/LICENSE") for name in names):
              raise SystemExit("LICENSE missing from wheel metadata")
          print(f"wheel contains {len(names)} files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  exe:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and PyInstaller
        run: |
          pip install -e ".[gui]" "pyinstaller>=6,<7"
      - name: Build executable
        shell: pwsh
        run: |
          packaging/build_exe.ps1 -Clean
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          Copy-Item dist/wakeword-trainer.exe "dist/wakeword-trainer-$version-windows-x64.exe"
          Get-Item "dist/wakeword-trainer-$version-windows-x64.exe" | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/wakeword-trainer-*-windows-x64.exe

  pypi:
    name: Publish to PyPI
    needs: dist
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty secret falls back to Trusted Publishing (OIDC).
          password: ${{ secrets.PYPI_API_TOKEN }}

  release:
    name: Create GitHub release
    needs: [dist, exe]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "wakeword-trainer ${GITHUB_REF_NAME}" \
            --generate-notes
