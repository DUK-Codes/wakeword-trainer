name: Secret check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Inspect token secret
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          DUMMY: ${{ secrets.TEST_SECRET }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TOKEN_EMPTY"
          else
            echo "TOKEN_PRESENT length=${#TOKEN} prefix_ok=$([[ "$TOKEN" == pypi-* ]] && echo yes || echo no)"
          fi
          echo "DUMMY=$DUMMY"
